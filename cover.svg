<svg width="800" height="320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1"/>
    </linearGradient>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 48px; font-weight: bold; fill: #f8fafc; text-anchor: middle; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
      sans-serif; font-size: 24px; fill: #94a3b8; text-anchor: middle; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 48px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="800" height="320" fill="url(#bg)" rx="12"/>
  <!-- Claude Code Label -->
  <text x="400" y="105" class="label" fill="#da7756">Claude Code</text>
  <!-- Main Title -->
  <text x="400" y="195" class="title">AI 编码助手配置中心</text>
  <!-- Subtitle -->
  <text x="400" y="260" class="subtitle">开箱即用的配置模板与最佳实践</text>
</svg>
